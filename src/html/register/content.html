<section class="sect pt-0">
  <div class="container">

    <div class="bg--light-bckg cartBlock rounded-20 max-w-480 mx-auto">
      <h3 class="mb-4 fw-semibold">
        Регистрация
      </h3>
      <div class="d-flex gap-2 align-items-center mb-4 pb-3">
        <span>Уже зарегистрированы?</span>
        <a class="color-orange" href="#">Войти</a>
      </div>
      <div class="inputW mb-3">
        <div class="h5 mb-2">Email</div>
        <input type="email" class="formInput border-grey-2" placeholder="email@example.com">
      </div>
      <div class="inputW mb-3">
        <div class="h5 mb-2">Телефон</div>
        <input type="tel" class="formInput border-grey-2" placeholder="+7(___)___ __-__">
      </div>
      <div class="inputW mb-3 position-relative">
        <div class="h5 mb-2">Пароль</div>
        <input type="password" class="formInput formInput--password border-grey-2">
        <div class="togglePasswordBtn"><img src="@img/icons/eye.svg" alt="icon"></div>
      </div>
      <div class="inputW mb-3 position-relative">
        <div class="h5 mb-2">Повторите пароль</div>
        <input type="password" class="formInput formInput--password border-grey-2">
        <div class="togglePasswordBtn"><img src="@img/icons/eye.svg" alt="icon"></div>
      </div>
      <div class="agreement mb-3">
        <input type="checkbox" id="orderAgree">
        <label for="orderAgree" class="align-items-start">
          <div class="rect"></div>
          <div class="agreementText fz-13">
            Я ознакомился с условиями <a class="color-orange" href="#">Публичной оферты</a> и соглашаюсь на
            обработку персональных данных в соответствии с
            <a class="color-orange" href="#">Пользовательским соглашением</a>, и <a class="color-orange"
              href="#">Политикой в отношении обработки персональных данных</a>
          </div>
        </label>
      </div>
      <div class="agreement mb-3">
        <input type="checkbox" id="orderAgree_2">
        <label for="orderAgree_2" class="align-items-start">
          <div class="rect"></div>
          <div class="agreementText fz-13">
            Согласен на получение информационной рассылки и уведомлений
          </div>
        </label>
      </div>
      <button class="button button--h-48 button--orange rounded-20 fz-16 fw-bold px-4 ml-auto">
        Зарегистрироваться
      </button>
    </div>

  </div>
</section>
